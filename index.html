<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100515">
  <title>Video Viral</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>VIDEO VIRAL</h1>
      <p>Halaman koleksi video pilihan.</p>
    </header>
    <section class="video-card" aria-labelledby="video-title">
      <h2 id="video-title">Video Pilihan Hari Ini</h2>
      <div class="thumbnail" aria-label="Pratinjau video">
        <span class="play-icon" aria-hidden="true">▶</span>
      </div>
      <p class="description">Tekan tombol di bawah untuk membuka halaman tujuan.</p>
      <a id="destinationButton" class="cta-button"
         href="https://example.com"
         target="_blank" rel="noopener noreferrer">BUKA VIDEO SEKARANG</a>
      <p class="notice">Kamu akan diarahkan ke situs lain saat menekan tombol.</p>
    </section>
  </main>
  <script src="thumbnail.webp"></script>
</body>
</html>
